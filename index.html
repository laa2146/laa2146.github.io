<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Portfolio</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/x-icon" href="favicon.ico">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16x16.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
  </head>

  <body>
    <!-- NAVBAR -->
    <header class="navbar">
      <div class="navbar-container">
        <div class="navbar-brand">
          <div class="brand-image" id="brand-image">
            <span class="brand-initial" id="brand-initial">L</span>
          </div>
          <span class="brand-name" id="brand-name">Luis Arias</span>
        </div>

        <div class="mobile-menu-toggle">☰</div>

        <nav class="navbar-menu">
          <a class="nav-link" href="#home">Home</a>
          <a class="nav-link" href="#about">About</a>
          <a class="nav-link" href="#impact">Impact</a>
          <a class="nav-link" href="#projects">Projects</a>
          <a class="nav-link" href="#skills">Skills</a>
          <a class="nav-link" href="#education">Education</a>
          <a class="nav-link" href="#hobbies">Hobbies</a>
          <a class="nav-link" href="#contact">Contact</a>
        </nav>

        <div class="navbar-social" id="navbar-social"></div>
      </div>
    </header>

    <main class="main-content">
      <!-- HERO -->
      <section id="home" class="hero-section">
        <div class="container hero-content">
          <h1 class="hero-name" id="hero-name">Luis Arias</h1>
          <p class="hero-tagline">
            <span class="tagline-prefix">I'm a</span>
            <span class="typewriter" id="typewriter"></span>
            <span class="cursor">|</span>
          </p>
        </div>
      </section>

      <!-- ABOUT -->
      <section id="about" class="section about-section">
        <div class="container">
          <div class="section-header">
            <h2 class="section-title">About</h2>
            <div class="title-underline"></div>
          </div>

          <div class="about-grid">
            <div class="about-image-wrapper">
              <div class="about-image" id="about-image">
                <span class="about-initial" id="about-initial">L</span>
              </div>
            </div>
            <div class="about-content" id="about-content"></div>
          </div>
        </div>
      </section>

      <!-- IMPACT -->
      <section id="impact" class="section projects-section">
        <div class="container">
          <div class="section-header">
            <h2 class="section-title" id="impact-title">Selected Impact</h2>
            <div class="title-underline"></div>
          </div>
          <div class="projects-grid" id="impact-container"></div>
        </div>
      </section>

      <!-- PROJECTS -->
      <section id="projects" class="section projects-section">
        <div class="container">
          <div class="section-header">
            <h2 class="section-title">Projects</h2>
            <div class="title-underline"></div>
          </div>
          <div class="projects-grid" id="projects-container"></div>
        </div>
      </section>

      <!-- SKILLS -->
      <section id="skills" class="section skills-section">
        <div class="container">
          <div class="section-header">
            <h2 class="section-title">Skills</h2>
            <div class="title-underline"></div>
          </div>
          <div class="skills-grid" id="skills-container"></div>
        </div>
      </section>

      <!-- EDUCATION -->
      <section id="education" class="section education-section">
        <div class="container">
          <div class="section-header">
            <h2 class="section-title">Education</h2>
            <div class="title-underline"></div>
          </div>
          <div class="education-timeline" id="education-container"></div>
        </div>
      </section>

      <!-- HOBBIES -->
      <section id="hobbies" class="section hobbies-section">
        <div class="container">
          <div class="section-header">
            <h2 class="section-title">Hobbies & Interests</h2>
            <div class="title-underline"></div>
          </div>
          <div class="hobbies-grid" id="hobbies-container"></div>
        </div>
      </section>

      <!-- CONTACT -->
      <section id="contact" class="section contact-section">
        <div class="container contact-content">
          <div class="section-header">
            <h2 class="section-title">Get In Touch</h2>
            <div class="title-underline"></div>
          </div>

          <div class="contact-info" id="contact-info"></div>
          <div class="contact-social" id="contact-social"></div>
        </div>
      </section>
    </main>

    <footer class="footer">
      © <span id="year"></span> <span id="footer-name"></span>. All rights reserved.
    </footer>

    <script src="./script.js"></script>
  </body>
</html>
